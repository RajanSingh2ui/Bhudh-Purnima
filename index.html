<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>रक्षाबंधन की शुभकामनाएँ</title>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@700&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="raksha-bandhan.avif">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; margin:0; padding:0; background: radial-gradient(circle at top, #fff1e6, #ffe0b2); color:#4a1a0a; overflow-x:hidden; }
    .container { max-width:600px; margin:30px auto; background:rgba(255, 255, 255,0.9); padding:20px; border:3px solid #ffb300; border-radius:20px; box-shadow:0 0 20px rgba(255,160,0,0.6); position:relative; }
    h1 { font-family:'Charm', cursive; color:#d84315; font-size:2.8em; margin-bottom:5px; }
    .typing { height:1.5em; color:#6d4032; font-size:1.1em; margin-bottom:10px; }
    .input-group label { display:block; text-align:left; margin-top:12px; color:#6d4032; }
    input, textarea, select { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; margin-top:5px; }
    button { padding:12px; margin-top:20px; background:#ff6f00; color:white; border:none; border-radius:25px; font-size:1.1em; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.3); }
    button:hover { transform:translateY(-2px); }
    .image-preview { width:100%; max-height:260px; object-fit:contain; border:2px dashed #ff6f00; margin-top:10px; display:none; }
    #outputCard { display:none; border:3px solid #ff8f00; padding:20px; border-radius:15px; margin-top:25px; background:#fff8f0; }
    #outputCard img { max-width:100%; margin-top:15px; border-radius:10px; }
    .countdown { margin-top:15px; font-size:1.1em; color:#e65100; }
    .music-control { margin-top:20px; }
    canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; }

    #diwaliImage {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 4px solid #ffd700;
            box-shadow: 0 0 20px #ffab00;
        }
  </style>
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>

  <div class="container">
    <h1>शुभ रक्षाबंधन!</h1>
    <div class="typing" id="typingEffect"></div>

    <div class="input-group">
      <label>आपका नाम:</label>
      <input type="text" id="senderName" placeholder="उदाहरण: Rajan">

      <label>शुभ संदेश (या चुनें):</label>
      <select id="presetSelect">
        <option value="">-- एक संदेश चुनें --</option>
        <option>रक्षाबंधन की ढेर सारी शुभकामनाएँ! यह बंधन सदा बना रहे!</option>
        <option>भाई-बहन का प्यार सबसे अनमोल होता है। शुभ रक्षाबंधन!</option>
        <option>इस रक्षाबंधन पर ढेर सारी खुशियाँ और प्यार मिले!</option>
        <option>राखी के इस पावन पर्व पर आपका जीवन खुशियों से भर जाए!</option>
        <option>रक्षा का बंधन प्रेम और विश्वास की मिशाल है!</option>
      </select>
      <textarea id="customMessage" rows="3" placeholder="या अपना विशेष संदेश लिखें"></textarea>

      <button onclick="generateCard()">🎉 कार्ड देखें और शेयर करें</button>
    </div>

    <div id="outputCard">
      <div id="cardMessage"></div>
      <video id="diwaliImage" src="rakhi.mp4" autoplay controls ></video>

      <button><a href="#">Create Your Template</a></button>
    </div>
    <div class="links">
      <p>🔗 यह लिंक शेयर करें:</p>
      <input type="text" id="shareLink" readonly style="width:100%;padding:8px;">
      <button onclick="copyLink()">कॉपी करें</button>
      <button onclick="shareWhatsApp()">WhatsApp शेयर</button>
    </div>
  </div>

<script>

  // Fireworks animation (limited & optimized)
  const canvas = document.getElementById('fireworksCanvas'), ctx = canvas.getContext('2d');
  let fireworks =[], particles=[]; let launchCount=0;
  function setupCanvas(){canvas.width=innerWidth;canvas.height=innerHeight;}
  window.onresize = setupCanvas; setupCanvas();
  class Firework{ constructor(x,y,tx,ty,c){ /*... same optimized code ...*/ } update(i){/*...*/} draw(){/*...*/} }
  class Particle{ /*...*/ }
  function hexToRgb(hex){ /*...*/ }
  function createParticles(x,y,color){ /*...*/ }
  const fireworkColors=['#FFD700','#FF4500','#FF69B4','#ADFF2F'];
  function launchFirework(){ if (launchCount<40){ /* push code */ launchCount++; } }
  function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height);
    fireworks.forEach((f,i)=>{f.update(i);f.draw();});
    particles.forEach((p,i)=>{p.update(i);p.draw();});
    if (fireworks.length||particles.length) requestAnimationFrame(animate);
  }
  animate(); setTimeout(launchFirework,200); setInterval(launchFirework,800);
  
  // Typing effect
  function typeEffect(txt, elId, speed=100){ let i=0; function t(){ if(i<txt.length){document.getElementById(elId).textContent+=txt[i++]; setTimeout(t,speed);} } t();}
  window.onload = function(){ typeEffect("आपको और आपके परिवार को रक्षाबंधन  की हार्दिक शुभकामनाएँ!", "typingEffect"); startCountdown(); };

  function startCountdown(){
    const eventDate = new Date('2025-08-9'), now=new Date();
    let d=Math.ceil((eventDate-now)/(1000*60*60*24));
    document.getElementById('countdownTimer').textContent = `रक्षाबंधन में ${d} दिन शेष हैं!`;
  }

  document.getElementById('presetSelect').addEventListener('change', e=>{
    document.getElementById('customMessage').value = e.target.value;
  });

  function showImage(e){ const img=document.getElementById('preview'); img.src=URL.createObjectURL(e.target.files[0]); img.style.display='block'; }

  function generateCard(){
    const n=document.getElementById('senderName').value|| 'आपको और आपके परिवार को रक्षाबंधन  की हार्दिक शुभकामनाएँ!';
    const m=document.getElementById('customMessage').value|| 'रक्षाबंधन की हार्दिक शुभकामनाएँ!';
    document.getElementById('cardMessage').innerHTML = `<p style="font-size:1.2em;color:#d84315;"><strong>${m}</strong></p><p>— ${n}</p>`;
    const url = new URL(window.location);
    url.searchParams.set('sender', n);
    url.searchParams.set('msg', encodeURIComponent(m));
    document.getElementById('shareLink').value = url.toString();
    document.getElementById('outputCard').style.display = 'block';
  }

  function copyLink(){ navigator.clipboard.writeText(document.getElementById('shareLink').value).then(()=>alert('लिंक कॉपी हो गया!')); }

  function shareWhatsApp(){
    let link = document.getElementById('shareLink').value;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("रक्षाबंधन की शुभकामनाएँ! " + link)}`, '_blank');
  }

  function toggleMusic(){ const m=document.getElementById('bgMusic'); m.muted=!m.muted; }


  // Show card directly if link has sender/message params
(function showCardIfLinkOpened(){
  const urlParams = new URLSearchParams(window.location.search);
  const sender = urlParams.get('sender');
  const tag = urlParams.get('tag');
  const msg = urlParams.get('msg');

  if (sender && msg) {
    const f = tag ? `(${tag})` : '';
    document.getElementById('cardMessage').innerHTML = `<p style="font-size:1.2em;color:#d84315;"><strong>${decodeURIComponent(msg)}</strong></p><p style="float: right;">— ${sender}</p>`;
    document.getElementById('outputCard').style.display = 'block';

    // Hide form and extras
    document.querySelector('.input-group').style.display = 'none';
    document.querySelector('.links').style.display = 'none';
    document.querySelector('.music-control').style.display = 'none';
    document.getElementById('countdownTimer').style.display = 'none';

    // Optional: scroll to card
    window.scrollTo({ top: document.getElementById('outputCard').offsetTop - 20, behavior: 'smooth' });
  }
})();

</script>
</body>
</html>
